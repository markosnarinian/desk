name: Release desk

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desk-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desk-binaries-${{ github.sha }}
          path: dist
      - name: Prepare Homebrew formula
        run: python3 scripts/homebrew.py "$GITHUB_REF_NAME" dist > dist/desk.rb
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS dist/desk.rb \
            --verify-tag --draft --title "$tag" --generate-notes
          gh release edit "$tag" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: desk-homebrew-${{ github.sha }}
          path: dist/desk.rb

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN with contents-write access to markosnarinian/homebrew-tap before releasing.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: desk-homebrew-${{ github.sha }}
          path: release
      - uses: actions/checkout@v4
        with:
          repository: markosnarinian/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Desk formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp release/desk.rb tap/Formula/desk.rb
          ruby -c tap/Formula/desk.rb
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Formula/desk.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "Update desk to $VERSION"
            git -C tap push
          fi
