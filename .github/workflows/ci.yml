name: Verify desk

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install shells for integration tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install shells for integration tests (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: scripts/install_test.sh
      - run: python3 scripts/distribution_test.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desk-site
          path: site/out/

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build archives
        run: |
          version="ci-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          fi
          scripts/release.sh "$version"
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir "$RUNNER_TEMP/desk-smoke"
          tar -xzf "dist/desk_${version}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/desk-smoke"
          test "$("$RUNNER_TEMP/desk-smoke/desk" version)" = "$version"
          cmp LICENSE "$RUNNER_TEMP/desk-smoke/LICENSE"
      - uses: actions/upload-artifact@v4
        with:
          name: desk-binaries-${{ github.sha }}
          path: dist/
          retention-days: 30
